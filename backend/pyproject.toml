[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-marketplace-backend"
version = "0.1.0"
description = "Advanced modular monolith marketplace backend"
requires-python = ">=3.11"
dependencies = [
  "celery>=5.4.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "minio>=7.2.0",
  "opensearch-py>=2.6.0",
  "passlib[bcrypt]>=1.7.4",
  "pillow>=11.1.0",
  "pydantic-settings>=2.6.0",
  "pyjwt>=2.9.0",
  "python-multipart>=0.0.9",
  "redis>=5.2.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
